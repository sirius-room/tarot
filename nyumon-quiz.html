<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>生命の樹入門クイズ｜シリウスの部屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#131a33;
    --night2:#0c1122;
    --panel:rgba(255,255,255,.055);
    --panel2:rgba(255,255,255,.03);
    --line:rgba(201,168,76,.28);
    --gold:#c9a84c;
    --gold-soft:#e6d9ae;
    --ink:#e9e6dc;
    --ink-soft:#a8adc2;
    --ok:#7fd6a2;
    --ng:#e88b8b;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;
    background:radial-gradient(circle at 50% -10%, #232c52 0%, var(--night) 45%, var(--night2) 100%) fixed;
    color:var(--ink);
    line-height:1.85;
    min-height:100vh;
    -webkit-text-size-adjust:100%;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.65) 50%, transparent 51%),
      radial-gradient(1px 1px at 28% 62%, rgba(255,255,255,.4) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 45% 12%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 62% 48%, rgba(255,255,255,.4) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 78% 26%, rgba(255,255,255,.6) 50%, transparent 51%),
      radial-gradient(1px 1px at 90% 68%, rgba(255,255,255,.4) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 8% 82%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 55% 88%, rgba(255,255,255,.35) 50%, transparent 51%);
  }
  .wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:24px 16px 60px;}
  .mincho{font-family:"Shippori Mincho",serif;}

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:26px 20px;
    backdrop-filter:blur(6px);
    box-shadow:0 18px 40px rgba(0,0,0,.35);
  }
  .fade{animation:fade .45s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

  /* ---- トップ ---- */
  .hero{text-align:center;}
  .hero .tree{font-size:38px;line-height:1;}
  .hero h1{
    font-family:"Shippori Mincho",serif;
    font-size:clamp(21px,5.4vw,29px);
    letter-spacing:.06em;
    margin:10px 0 6px;
    background:linear-gradient(100deg,var(--gold-soft),var(--gold) 60%,#a98c33);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero .sub{font-size:13px;color:var(--ink-soft);letter-spacing:.14em;}
  .hero p.lead{font-size:15px;margin-top:16px;text-align:left;}

  .rulebox{
    text-align:left;background:var(--panel2);border:1px solid rgba(255,255,255,.08);
    border-radius:14px;padding:14px 16px;margin:18px 0 6px;font-size:14px;
  }
  .rulebox div{margin:4px 0;}

  h2.sec{
    font-family:"Shippori Mincho",serif;font-size:16px;letter-spacing:.12em;
    color:var(--gold-soft);margin:30px 0 12px;text-align:center;
  }
  h2.sec span{display:inline-block;border-bottom:1px solid var(--line);padding-bottom:6px;}

  .chlist{display:grid;gap:10px;}
  .chbtn{
    width:100%;text-align:left;cursor:pointer;
    background:var(--panel);border:1px solid rgba(255,255,255,.1);border-radius:14px;
    padding:14px 16px;color:var(--ink);font-family:inherit;font-size:15px;
    display:flex;align-items:center;gap:12px;transition:.2s;
  }
  .chbtn:hover{border-color:var(--gold);background:rgba(201,168,76,.09);transform:translateY(-1px);}
  .chbtn .num{
    flex:0 0 auto;width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.08);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--gold-soft);
  }
  .chbtn .body{flex:1;min-width:0;}
  .chbtn .t{display:block;font-weight:700;line-height:1.5;}
  .chbtn .d{display:block;font-size:12px;color:var(--ink-soft);line-height:1.6;}
  .chbtn .score{flex:0 0 auto;font-size:12px;color:var(--gold);}

  .btn{
    display:block;width:100%;cursor:pointer;font-family:inherit;font-weight:700;
    border:none;border-radius:999px;padding:15px 20px;font-size:16px;
    background:linear-gradient(100deg,#c9a84c,#e0c877);color:#22283f;
    box-shadow:0 10px 24px rgba(201,168,76,.22);transition:.2s;margin-top:18px;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn.ghost{
    background:transparent;border:1px solid rgba(255,255,255,.28);color:var(--ink);
    box-shadow:none;font-weight:500;
  }
  .btn.ghost:hover{border-color:var(--gold);color:var(--gold-soft);}

  /* ---- 章とびら ---- */
  .cover{text-align:center;padding:38px 22px;}
  .cover .ic{font-size:42px;}
  .cover h2{font-family:"Shippori Mincho",serif;font-size:21px;margin:12px 0 4px;color:var(--gold-soft);letter-spacing:.06em;}
  .cover .ch{font-size:12px;letter-spacing:.2em;color:var(--ink-soft);}
  .cover p{font-size:14.5px;margin-top:16px;text-align:left;}

  /* ---- 出題 ---- */
  .topbar{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:8px;letter-spacing:.08em;}
  .topbar .home{cursor:pointer;background:none;border:none;color:var(--ink-soft);font-family:inherit;font-size:12px;padding:2px 0;text-decoration:underline;}
  .bar{height:5px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:16px;}
  .bar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#8f7fd6,#c9a84c);transition:width .45s ease;}

  .qno{font-size:11.5px;letter-spacing:.22em;color:var(--gold);margin-bottom:8px;}
  .qtext{font-size:17.5px;font-weight:700;line-height:1.8;margin-bottom:20px;}
  .opts{display:grid;gap:10px;}
  .opt{
    width:100%;text-align:left;cursor:pointer;font-family:inherit;font-size:15px;line-height:1.7;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);
    border-radius:14px;padding:13px 14px;color:var(--ink);display:flex;gap:11px;align-items:flex-start;transition:.15s;
  }
  .opt:hover{border-color:var(--gold);background:rgba(201,168,76,.1);}
  .opt .mk{
    flex:0 0 auto;width:26px;height:26px;border-radius:50%;font-size:12.5px;
    background:rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;margin-top:2px;
  }
  .opt.correct{border-color:var(--ok);background:rgba(127,214,162,.14);}
  .opt.wrong{border-color:var(--ng);background:rgba(232,139,139,.12);}
  .opt.dim{opacity:.45;}
  .opt:disabled{cursor:default;}

  .judge{display:flex;align-items:center;gap:10px;margin:20px 0 12px;}
  .judge .mark{font-size:26px;}
  .judge .txt{font-family:"Shippori Mincho",serif;font-size:19px;letter-spacing:.08em;}
  .judge.ok .txt{color:var(--ok);}
  .judge.ng .txt{color:var(--ng);}

  .exp{
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);
    border-left:3px solid var(--gold);border-radius:12px;padding:15px 16px;
    font-size:14.5px;white-space:pre-wrap;line-height:1.9;
  }
  .exp .ic{font-size:26px;display:block;text-align:center;margin-bottom:6px;}

  /* ---- 結果 ---- */
  .result{text-align:center;}
  .result .score{font-family:"Shippori Mincho",serif;font-size:52px;line-height:1.2;color:var(--gold-soft);}
  .result .score small{font-size:18px;color:var(--ink-soft);}
  .result .rank{font-family:"Shippori Mincho",serif;font-size:20px;margin:10px 0 6px;color:var(--gold);}
  .result p.msg{font-size:14.5px;color:var(--ink);margin-bottom:6px;}
  .review{text-align:left;margin-top:22px;}
  .review h3{font-size:13px;letter-spacing:.12em;color:var(--gold-soft);margin-bottom:10px;}
  .rv{
    background:rgba(232,139,139,.08);border:1px solid rgba(232,139,139,.25);
    border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:13.5px;line-height:1.8;
  }
  .rv .q{font-weight:700;margin-bottom:4px;}
  .rv .a{color:var(--ok);}
  .foot{text-align:center;font-size:11.5px;color:var(--ink-soft);margin-top:28px;letter-spacing:.08em;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* =========================================================
   生命の樹入門 完全解説書（シリウスの部屋）準拠クイズ
   ========================================================= */

const CHAPTERS = [
  { t:"タロットの歴史",        ic:"🃏", d:"遊び道具から宇宙の鍵へ",       lead:"タロットは、生まれたときは占いの道具ではありませんでした。貴族の遊び道具から、生命の樹と結びついて「宇宙の真理を解き明かす鍵」になるまで。その道すじをたどります。" },
  { t:"生命の樹の基本",        ic:"🌳", d:"10のセフィラと22のパス",       lead:"生命の樹は、宇宙の構造と人間の意識を一枚の図にしたもの。そして、タロット78枚はこの図とぴったり対応しています。まずは全体の骨組みから。" },
  { t:"3つ（4つ）の境界線",    ic:"🌫", d:"深淵・ヴェール・肉体の境",     lead:"10のセフィラは、3つの境界線によって4つの領域に分かれています。エネルギーが上から下へ、どう段階を踏んで降りてくるのか。ここが分かると樹全体が一気に読めます。" },
  { t:"天上の三つ組",          ic:"👑", d:"ケテル・コクマー・ビナー",     lead:"深淵（アビス）の上、1・2・3の世界。時間も空間もなく、まだ「ぼやっと一つ」のワンネスの領域です。すべての始まりの場所へ。" },
  { t:"ヴェールの上／魂の領域", ic:"☀️", d:"ケセド・ゲブラー・ティファレト", lead:"4・5・6は、他人の影響を受けない領域。世間の常識でも家族の願いでもなく、魂次元の自分が本当に望んでいることに氣づける場所です。" },
  { t:"ヴェールの下／無意識のループ", ic:"🌀", d:"ネツァク・ホド・イエソド・マルクト", lead:"7・8・9・10は、私たちが毎日生きている領域。感情→思考→思い込み→現実というループが、そのまま現実を作り出しています。" },
  { t:"総仕上げ・天体対応",    ic:"🪐", d:"10のセフィラを一気に確認",     lead:"最後は、10のセフィラと天体の対応を総ざらい。ここが体に入ると、カードを見た瞬間に「今どこにいるか」が浮かぶようになります。" }
];

/* ch = 章番号(0始まり) */
const QUIZ = [

/* ===== 第1章 タロットの歴史 ===== */
{ch:0, ic:"🏰", q:"現存する最古のタロットカードと言われているのは？",
 o:["マルセイユタロット","ヴィスコンティ・スフォルツァ版タロット","ウェイト版タロット","トートタロット"], a:1,
 e:"正解は「ヴィスコンティ・スフォルツァ版タロット」。\n15世紀半ば（1450年頃）、イタリアのミラノで作られました。当時のミラノ公爵だったヴィスコンティ家とスフォルツァ家のための、豪華な手描きのカードだったんです。"},

{ch:0, ic:"🎴", q:"タロットが最初に生まれたとき、それは何のための道具だった？",
 o:["占いのための道具","貴族たちの遊び道具（ゲーム）","教会の儀式の道具","商人が使う計算道具"], a:1,
 e:"正解は「貴族たちの遊び道具」。\nタロットと聞くと占いや神秘的なイメージですが、誕生した時は占いとまったく関係のない、貴族の遊び道具だったのです。"},

{ch:0, ic:"⚖️", q:"絵やシンボルに意味を込めて表現する技法を、なんと呼ぶ？",
 o:["数秘術","図像学","錬金術","象徴主義"], a:1,
 e:"正解は「図像学」。\nたとえば「正義」のカードに描かれる天秤と剣は、「公平さ」と「決断力」を表しています。初期のタロットは、キリスト教的世界観や道徳観、古代の神話や哲学を、この図像学の手法で描いていました。"},

{ch:0, ic:"⛵", q:"マルセイユタロットの説明として正しいのは？",
 o:["一点ものの豪華な手描きカードだった","南フランスの港町で印刷業が発展したことで、庶民にも手の届く価格で普及した","19世紀末のイギリスで作られた","小アルカナの数札すべてに絵柄が描かれている"], a:1,
 e:"正解は「印刷業が発展したことで、庶民価格で普及した」。\n16〜17世紀にイタリアからフランスへ伝わる中で誕生し、港町マルセイユで印刷業が盛んになったことでヨーロッパ各地に広まりました。ヴィスコンティ版と比べるとシンプルで力強い線画が特徴です。"},

{ch:0, ic:"🔑", q:"19世紀フランスの魔術師エリファス・レヴィが提唱した、タロット史最大の転換点となる理論は？",
 o:["大アルカナ22枚は、生命の樹の22の経路（パス）と対応している","タロットは古代エジプトで生まれた","小アルカナは占いに使わなくてよい","カードは逆さにして読むべきである"], a:0,
 e:"正解は「大アルカナ22枚は生命の樹の22の経路と対応している」。\nこの発見によって、タロットは遊び道具から「宇宙の真理を解き明かす神秘の鍵」へと生まれ変わりました。"},

{ch:0, ic:"2️⃣2️⃣", q:"レヴィが「すべて対応している」と主張した3つの22。その組み合わせは？",
 o:["22のパス・ヘブライ文字22文字・大アルカナ22枚","22のパス・22の星座・22の元素","22のセフィラ・22の柱・22のスート","22の天体・22の神々・22の数札"], a:0,
 e:"正解は「22のパス・ヘブライ文字22文字・大アルカナ22枚」。\n生命の樹は10個のセフィラ（円）と、それらを結ぶ22本の経路でできています。この22という数字が、ヘブライ文字とも大アルカナともぴったり重なるのです。"},

{ch:0, ic:"🌅", q:"19世紀末のイギリスで設立され、カバラ・錬金術・占星術・タロットを体系的に学んだ秘密結社は？",
 o:["薔薇十字団","黄金の夜明け団","テンプル騎士団","王立天文学会"], a:1,
 e:"正解は「黄金の夜明け団（ハーメティック・オーダー・オブ・ザ・ゴールデン・ドーン）」。\n西洋神秘思想を体系的に学び実践する場として、多くの知識人が集まりました。ウェイトもクローリーも、ここの団員です。"},

{ch:0, ic:"🎨", q:"1909年に発表された「ウェイト版タロット」を作ったのは？",
 o:["アーサー・エドワード・ウェイトとパメラ・コールマン・スミス","アレイスター・クローリーとフリーダ・ハリス","エリファス・レヴィとマルセイユの印刷職人","ヴィスコンティ家とスフォルツァ家"], a:0,
 e:"正解は「ウェイトとパメラ・コールマン・スミス」。\n黄金の夜明け団の団員だったウェイトが、画家のパメラ・コールマン・スミスと協力して発表しました。"},

{ch:0, ic:"🗡", q:"ウェイト版タロットが画期的だった点は？",
 o:["大アルカナを22枚に整えたこと","小アルカナの数札にも、すべて具体的な絵柄を描いたこと","カードの枚数を78枚に増やしたこと","色を使わずに描いたこと"], a:1,
 e:"正解は「小アルカナの数札にもすべて絵柄を描いたこと」。\nたとえばソードの3は、ハートに3本の剣が刺さった絵。「悲しみ」や「心の痛み」が、見ただけで直感的にわかるようになりました。"},

{ch:0, ic:"🐍", q:"「トートタロット」を作ったのは？",
 o:["ウェイトとスミス","アレイスター・クローリーとフリーダ・ハリス","エリファス・レヴィ","ジョン・マイケル・グリア"], a:1,
 e:"正解は「クローリーとフリーダ・ハリス」。\nクローリーもウェイトと同じく黄金の夜明け団の団員でした。カードにはカバラ・占星術・エジプト神話・錬金術・数秘術など、あらゆる秘教的シンボルが詰め込まれています。"},

{ch:0, ic:"🗺", q:"魔術系タロットにおいて、生命の樹はどんな位置づけ？",
 o:["カードを美しく見せるための装飾","宇宙の構造そのものであり、意識の階層と魂の成長の道すじを示す地図","カードを並べるときのルール表","的中率を上げるためのおまじない"], a:1,
 e:"正解は「宇宙の構造そのものであり、魂の成長の道すじを示す地図」。\n魔術系タロットでは、生命の樹はただの飾りではありません。ここが分かると、カードの意味を暗記しなくても構造で読めるようになります。"},

/* ===== 第2章 生命の樹の基本 ===== */
{ch:1, ic:"🌳", q:"生命の樹（セフィロト・ツリー）は、何の中心となる図形？",
 o:["ギリシャ哲学","ユダヤ教の神秘思想カバラ","インド占星術","エジプトの死者の書"], a:1,
 e:"正解は「ユダヤ教の神秘思想カバラ」。\n宇宙がどう創造されたのか、神の力がどう流れているのか、人間の魂がどんな構造を持っているのかを、一つの図で表現しています。"},

{ch:1, ic:"⭕", q:"10個のセフィラ（球体）が表しているのは？",
 o:["エネルギーの状態・場所","変化・成長のプロセス","時間の流れ","カードの枚数"], a:0,
 e:"正解は「エネルギーの状態・場所」。\nセフィラは「今どこにいるか」を示す静的な場所です。地図でいうと駅や街にあたります。"},

{ch:1, ic:"〰️", q:"22本のパス（経路）が表しているのは？",
 o:["エネルギーの状態・場所","変化・成長のプロセス","天体の配置","人間関係"], a:1,
 e:"正解は「変化・成長のプロセス」。\nセフィラが「場所」なら、パスは「そこからどこへ向かうか」という動きです。"},

{ch:1, ic:"🏛", q:"生命の樹の3本の柱の組み合わせとして正しいのは？",
 o:["峻厳の柱（左）・慈悲の柱（右）・均衡の柱（中央）","慈悲の柱（左）・峻厳の柱（右）・調和の柱（中央）","男性の柱・女性の柱・子供の柱","光の柱・闇の柱・虹の柱"], a:0,
 e:"正解は「峻厳の柱（左）・慈悲の柱（右）・均衡の柱（中央）」。\n左右に相反する力があり、中央がそのバランスを取る。この3本立てが生命の樹の骨組みです。"},

{ch:1, ic:"🚶", q:"大アルカナ22枚が対応しているのは？",
 o:["10個のセフィラ","22本のパス（経路）","4つのスート","テトラグラマトン"], a:1,
 e:"正解は「22本のパス」。\n大アルカナは「変容・旅」を表します。どこかからどこかへ移動していく、動的なプロセスです。"},

{ch:1, ic:"🔢", q:"数札（エース〜10）が対応しているのは？",
 o:["10個のセフィラ","22本のパス","3本の柱","4つの元素だけ"], a:0,
 e:"正解は「10個のセフィラ」。\n数札は「状態・場所」を表します。今、自分がどのエネルギーの場所にいるのかを教えてくれるカードです。"},

{ch:1, ic:"🔤", q:"コートカード16枚が対応している原理は？",
 o:["22のパス","テトラグラマトン（YHVH）の原理","10のセフィラ","3本の柱"], a:1,
 e:"正解は「テトラグラマトン（YHVH）の原理」。\nコートカードは「どんな人物か」ではなく、現実が創られていく仕組みそのものを表しています。"},

{ch:1, ic:"⚖️", q:"数札と大アルカナの違いを、正しく説明しているのは？",
 o:["数札は良いカード、大アルカナは悪いカード","数札は「今どこにいるか」の静的な状態、大アルカナは「どこへ向かうか」の動的なプロセス","数札は過去、大アルカナは未来を表す","どちらも同じ意味なので区別しなくてよい"], a:1,
 e:"正解は「数札＝静的な状態、大アルカナ＝動的なプロセス」。\nこの違いを理解すると、リーディングが一段深まります。今いる場所（数札）と、これから進む道（大アルカナ）は役割がまったく違うのです。"},

{ch:1, ic:"🔥", q:"4つのスートと元素の組み合わせとして正しいのは？",
 o:["ワンド＝火／カップ＝水／ソード＝風／ペンタクル＝土","ワンド＝風／カップ＝火／ソード＝土／ペンタクル＝水","ワンド＝土／カップ＝風／ソード＝水／ペンタクル＝火","ワンド＝水／カップ＝土／ソード＝火／ペンタクル＝風"], a:0,
 e:"正解は「ワンド＝火／カップ＝水／ソード＝風／ペンタクル＝土」。\nワンドは情熱・意志・行動・創造性、カップは感情・愛・直感・想像力、ソードは思考・言葉・分析・決断、ペンタクルは物質・身体・現実・安定です。"},

{ch:1, ic:"🔥", q:"ワンドのキーワードとして正しいのは？",
 o:["情熱・意志・行動・創造性","感情・愛・直感・想像力","思考・言葉・分析・決断","物質・身体・現実・安定"], a:0,
 e:"正解は「情熱・意志・行動・創造性」。\nワンドは火のスート。燃え上がるような意志と、動き出すエネルギーを担当します。"},

{ch:1, ic:"💧", q:"カップのキーワードとして正しいのは？",
 o:["情熱・意志・行動・創造性","感情・愛・直感・想像力","思考・言葉・分析・決断","物質・身体・現実・安定"], a:1,
 e:"正解は「感情・愛・直感・想像力」。\nカップは水のスート。心の動き、人とのつながり、ふと湧いてくる直感を担当します。"},

{ch:1, ic:"💨", q:"ソードのキーワードとして正しいのは？",
 o:["情熱・意志・行動・創造性","感情・愛・直感・想像力","思考・言葉・分析・決断","物質・身体・現実・安定"], a:2,
 e:"正解は「思考・言葉・分析・決断」。\nソードは風のスート。切り分ける・区別する・言葉にするという働きを持っています。"},

{ch:1, ic:"🪙", q:"ペンタクルのキーワードとして正しいのは？",
 o:["情熱・意志・行動・創造性","物質・身体・現実・安定","思考・言葉・分析・決断","感情・愛・直感・想像力"], a:1,
 e:"正解は「物質・身体・現実・安定」。\nペンタクルは土のスート。目に見える形、体、お金、暮らしといった現実的な領域を担当します。"},

{ch:1, ic:"🧮", q:"数札が全部で40枚になるのは、なぜ？",
 o:["10個のセフィラ × 4つのスート","22のパス ＋ 18","4つの元素 × 10の天体","16のコートカード ＋ 24"], a:0,
 e:"正解は「10個のセフィラ × 4つのスート」。\n同じセフィラでも、火・水・風・土という違うフィルターを通すことで、違った形で現れます。だから10×4で40枚になるのです。"},

{ch:1, ic:"🔍", q:"同じセフィラでも、スートによって現れ方が変わるのはなぜ？",
 o:["カードの絵柄が違うから","火・水・風・土という異なるフィルターを通すから","作られた時代が違うから","占う人が違うから"], a:1,
 e:"正解は「異なるフィルターを通すから」。\nたとえば7はネツァク、感情や欲がテーマのセフィラ。それを火で感じるのか、水で感じるのか、風で考えるのか、土で受け取るのか。同じテーマでも、まったく違う顔になります。"},

/* ===== 第3章 3つ（4つ）の境界線 ===== */
{ch:2, ic:"🪜", q:"本書では、生命の樹の10個のセフィラを、いくつの境界線でいくつの領域に分けて説明している？",
 o:["1つの境界線・2つの領域","3つの境界線・4つの領域","4つの境界線・5つの領域","境界線はない"], a:1,
 e:"正解は「3つの境界線・4つの領域」。\n神聖なエネルギーが上から下へと段階的に降りてくる様子を表しています。\nちなみに専門書では「深淵とヴェールの2つの境界線・3つの領域」と書かれるのが一般的。本書では、4つのスートのエネルギーを分類するためと、物質世界を分かりやすく説明するために、便宜上9と10の間にもう1本線を引いています。"},

{ch:2, ic:"🕳", q:"1・2・3 と 4以下 を分ける境界線の名前は？",
 o:["ヴェール","深淵（アビス）","地平線","門"], a:1,
 e:"正解は「深淵（アビス）」。\n神の世界と人間界の境界です。ここを越えると、時間も空間もない世界に入ります。"},

{ch:2, ic:"🌫", q:"4・5・6 と 7以下 を分ける境界線の名前は？",
 o:["深淵（アビス）","ヴェール","柱","橋"], a:1,
 e:"正解は「ヴェール」。\n魂の領域と日常意識の境界です。ヴェールの上は他人に左右されない領域、下は他人と比べてしまう領域になります。"},

{ch:2, ic:"👣", q:"本書では、9（イエソド）と10（マルクト）の間に境界線を引いています。これは何の境界？",
 o:["意識と肉体の境界","過去と未来の境界","神と人間の境界","善と悪の境界"], a:0,
 e:"正解は「意識と肉体の境界」。\n肉体と、肉体以外の見えないエネルギーの境目です。分かりやすさのために引いた線で、専門書等ではこの境界線は書かれていません。"},

{ch:2, ic:"📖", q:"9と10の間の境界線について、正しい注意点は？",
 o:["すべての専門書に必ず書かれている","分かりやすさのために本書が引いた線で、専門書等では書かれていない","黄金の夜明け団が正式に定めたもの","カバラで最も重要な境界線とされている"], a:1,
 e:"正解は「本書が分かりやすさのために引いた線」。\n見えないエネルギーと肉体の違いをつかんでもらうための工夫です。ここは正直にお伝えしておきますね。"},

{ch:2, ic:"🌌", q:"深淵の上（ケテル・コクマー・ビナー）はどんな世界？",
 o:["すべてがはっきり分かれた分離の世界","すべてが一つにつながり、時間も空間も存在しないワンネスの世界","感情と思考がぶつかり合う世界","肉体で体験する世界"], a:1,
 e:"正解は「ワンネスの世界」。\n神話の神々の世界に似ていて、人間的な価値観や概念では理解できない領域です。"},

{ch:2, ic:"💎", q:"ヴェールの上（ケセド・ゲブラー・ティファレト）の特徴として正しいのは？",
 o:["他人の意見や社会に左右されず、純粋な魂の望みに触れられる","世間の評価が最も重要になる","感情のループが生まれる場所","何も感じられない領域"], a:0,
 e:"正解は「他人の意見や社会に左右されない領域」。\n外界の雑音から離れて、魂次元の自分が本当に望んでいることに氣づける場所です。俯瞰した視点で自分を観察することもできます。"},

{ch:2, ic:"🏘", q:"ヴェールの下（ネツァク・ホド・イエソド・マルクト）は、どんな領域？",
 o:["神々だけが入れる領域","私たちが日常的に生きている領域","何も存在しない空白の領域","魂だけが存在する領域"], a:1,
 e:"正解は「私たちが日常的に生きている領域」。\nここでは魂の純粋な声は聞こえにくくなり、感情や思考、無意識の思い込みが複雑に絡み合って、私たちの現実を作り出しています。"},

{ch:2, ic:"🔗", q:"「無意識の制限のループ」を形成しているのは、どの4つのセフィラ？",
 o:["ケテル・コクマー・ビナー・ダアト","ケセド・ゲブラー・ティファレト・イエソド","ネツァク・ホド・イエソド・マルクト","コクマー・ビナー・ケセド・ゲブラー"], a:2,
 e:"正解は「ネツァク（7）・ホド（8）・イエソド（9）・マルクト（10）」。\nこの4つが互いに影響し合ってループを作り、そのループがそのまま現実世界のマルクトに投影されていきます。"},

{ch:2, ic:"🎬", q:"イエソド（9）にあるものは、どこに投影されていく？",
 o:["ケテル（1）","ティファレト（6）","マルクト（10）の現実","天上の三つ組"], a:2,
 e:"正解は「マルクト（10）の現実」。\nイエソドにある潜在意識の制限や固定概念が、常に現実の思考や感情に影響を与えています。「私はこういう人間だ」という無意識の思い込みが、そのまま現実として投影されるのです。"},

/* ===== 第4章 天上の三つ組 ===== */
{ch:3, ic:"🔺", q:"ケテル（1）・コクマー（2）・ビナー（3）の3つをまとめて何と呼ぶ？",
 o:["天上の三つ組（至高三角形）","魂の三つ組","下位の三つ組","均衡の三角形"], a:0,
 e:"正解は「天上の三つ組（至高三角形）」。\nこの3つは、他の7つのセフィラとは根本的に違う性質を持っています。"},

{ch:3, ic:"🫧", q:"天上の三つ組の世界観を表す言葉は？",
 o:["分離の世界","ワンネスの世界","競争の世界","肉体の世界"], a:1,
 e:"正解は「ワンネスの世界」。\nすべてが一つにつながっていて、あなたと私の区別もない状態です。1から2と3に分かれても、まだ「ぼやっと一つ」。完全には分かれていません。"},

{ch:3, ic:"⏳", q:"天上の三つ組の特徴として、当てはまらないものは？",
 o:["時間が存在しない","空間の概念がない","因果関係がはっきりしていて、直線的な論理が通用する","三つでありながら一つで、分離がない"], a:2,
 e:"正解（＝当てはまらないもの）は「因果関係がはっきりしている」。\n天上の三つ組では因果関係は曖昧で、「これをしたから、あれが起こる」という直線的な論理は通用しません。神話の世界に似ているのです。"},

{ch:3, ic:"👑", q:"ケテルのヘブライ語の意味と、本書での対応天体は？",
 o:["王冠／海王星","知恵／天王星","理解／土星","王国／地球"], a:0,
 e:"正解は「王冠／海王星」。\nキーワードはワンネス・源・純粋なエネルギー。生命の樹の頂点であり、すべての始まりです。"},

{ch:3, ic:"📝", q:"ケテルの天体対応について、本書が添えている注記は？",
 o:["海王星は古代から一貫して対応づけられてきた","伝統的な体系では特定の天体ではなく「第一導因」が対応し、海王星は現代的解釈の後付けである","黄金の夜明け団が海王星を正式に定めた","天体は対応しないことになっている"], a:1,
 e:"正解は「伝統的には第一導因。海王星は現代的解釈の後付け」。\nクローリーが『トートの書』の資料部分で言及しており、海王星の神秘性・無限性・境界の溶解がケテルと共鳴すると考えられています。ただし後付けであることは押さえておきましょう。"},

{ch:3, ic:"💧", q:"ケテルを表す言葉として、本書で使われているのは？",
 o:["宇宙の一雫","大地の礎","魂の鏡","現実の器"], a:0,
 e:"正解は「宇宙の一雫」。\n無限の宇宙から一滴だけ取り出されたエッセンス。まだ形も名前も持たず、「在る様で無い、無いようで在る」不思議な場所です。カバラでは、アイン・ソフ・オウル（無限の光）から最初に現れた点とされます。"},

{ch:3, ic:"🌠", q:"カバラで、ケテルは何から最初に現れた「点」だとされている？",
 o:["アイン・ソフ・オウル（無限の光）","深淵（アビス）","マルクトの現実","4つの元素"], a:0,
 e:"正解は「アイン・ソフ・オウル（無限の光）」。\n無限の光から最初に現れた一点、それがケテルです。だからケテルには圧倒的な宇宙のエネルギーが満ちていて、まだ何も決まっていないのに、すべての可能性が含まれているのです。"},

{ch:3, ic:"⚡", q:"コクマーのヘブライ語の意味と、本書での対応天体は？",
 o:["王冠／海王星","知恵／天王星","理解／土星","慈悲／木星"], a:1,
 e:"正解は「知恵／天王星」。\nキーワードはひらめき・火花・男性原理・枠の外。伝統的な体系では「恒星点」、遠く輝く星々の世界として表現されていました。"},

{ch:3, ic:"💡", q:"コクマーのエネルギーが抱えている「一つの問題」とは？",
 o:["エネルギーが弱すぎる","枠組みができていないので、そのままでは扱いづらい","古すぎて現代では使えない","他人の影響を受けやすい"], a:1,
 e:"正解は「枠組みがないので、そのままでは扱いづらい」。\n素晴らしいアイデアがひらめいても、それだけではまだ形になりません。どう形にするか、どんな順番で進めるか、そういう具体的な枠組みがまだないからです。"},

{ch:3, ic:"🪐", q:"ビナーのヘブライ語の意味と、本書での対応天体は？",
 o:["理解／土星","知恵／天王星","峻厳／火星","美／太陽"], a:0,
 e:"正解は「理解／土星」。\nキーワードは形・枠組み・女性原理。コクマーの火花は、ビナーに到達して初めて具体性を帯び始めます。"},

{ch:3, ic:"☯️", q:"コクマーとビナーの対比として、正しいのは？",
 o:["コクマーは受け取る／ビナーは与える","コクマーは火花・光・広げる／ビナーは器・形・制限する","どちらも同じ働きをする","コクマーは女性原理／ビナーは男性原理"], a:1,
 e:"正解は「コクマーは火花・光・広げる／ビナーは器・形・制限する」。\n対極にありながら補完し合っています。この2つが結合して、初めて下の世界へエネルギーが流れ始めます。"},

{ch:3, ic:"🥤", q:"「無限に広がる水も、コップという枠に入れて初めて飲むことができる」。この例えが説明しているのは？",
 o:["ケテルのワンネス","ビナーの、形を与える働き","マルクトの現実","ネツァクの感情"], a:1,
 e:"正解は「ビナーの、形を与える働き」。\n制限は悲しいことのように感じるかもしれませんが、実はこの制限こそが形を生み出す力なのです。"},

{ch:3, ic:"🌱", q:"リーディングで天上の三つ組（エース・2・3）のカードが出たとき、どう読む？",
 o:["結果がもう決まっているサイン","新しい種が蒔かれた段階。結果はこれからの感じ方・考え方・行動次第","失敗を告げるサイン","何も起きないサイン"], a:1,
 e:"正解は「新しい種が蒔かれた段階」。\nまだ何も確定していません。逆に言えば、今までと同じ感じ方・考え方・行動をすれば、マルクトに着いたときの変化もそれなりということ。現実を変えたいなら、新しい意識の使い方が必要です。"},

{ch:3, ic:"🚪", q:"コクマー（2）のカードが出たとき、求められる挑戦は？",
 o:["前例に従って安全に進むこと","今までの枠を超えていくこと","誰かに決めてもらうこと","結果が出るまで待つこと"], a:1,
 e:"正解は「今までの枠を超えていくこと」。\n天王星が象徴するとおり、コクマーは革新と突破のエネルギー。「そんなの無理」と否定せず、「面白い、やってみよう」と受け入れる柔軟性が求められます。"},

{ch:3, ic:"✍️", q:"ビナー（3）のカードが出たとき、求められる挑戦は？",
 o:["完璧になるまで待つこと","自分の素地（すでにある枠組み）を使って、生み出していくこと","可能性をゼロに戻すこと","誰かの枠に合わせること"], a:1,
 e:"正解は「自分の素地を使って、生み出していくこと」。\nビナーは、枠組みやぼんやりとした輪郭がすでに見えている状態からの挑戦。コクマーが「何でもあり」の自由な火花なら、ビナーは「このルールの中で」という制約のある創造。その素地があるからこそ、形になっていくのです。"},

/* ===== 第5章 ヴェールの上／魂の領域 ===== */
{ch:4, ic:"♃", q:"ケセド（4）のヘブライ語の意味・対応天体・キーワードの組み合わせは？",
 o:["慈悲、憐れみ／木星／安心安全・記憶・拡大","力、峻厳／火星／選択・行動・意志","美、調和／太陽／俯瞰・氣づき・中心","基礎／月／潜在意識"], a:0,
 e:"正解は「慈悲、憐れみ／木星／安心安全・記憶・拡大」。\n深淵から降りてきたエネルギーが、人間界に最初に到着する場所です。"},

{ch:4, ic:"🫂", q:"ケセドが司る「記憶」とは、どんな記憶？",
 o:["過去の出来事を正確に思い出す記憶","論理的に「こうあるべきだ」と考えた安心の記憶","腹落ちするような経験がもたらす、深い安心安全の記憶","忘れたい嫌な記憶"], a:2,
 e:"正解は「経験がもたらす深い安心安全の記憶」。\n頭で理解するのではなく、体と心が「ああ、大丈夫だ」と感じられる土台のこと。優しく抱きしめられた記憶、助けてもらった記憶、やり遂げた記憶。その積み重ねです。"},

{ch:4, ic:"🌍", q:"ケセドが司る道徳には、地球的な規模から個人まで様々な次元があります。次元が高い（地球規模）ほど、その情報は？",
 o:["抽象的で普遍的になる","限定的で具体的になる","不正確になる","意味を失う"], a:0,
 e:"正解は「抽象的で普遍的になる」。\n地球規模なら「人の尊厳を尊重しよう」といった普遍的な倫理。個人レベルになるほど「私はこう生きる」という限定的で具体的なルールになっていきます。"},

{ch:4, ic:"🎈", q:"ケセドのエネルギーが抱えている限界とは？",
 o:["すぐに消えてしまう","それ自体では動かない。広がって膨らむだけで、具体的な行動につながらない","他人に奪われてしまう","一度きりしか使えない"], a:1,
 e:"正解は「それ自体では動かない」。\n木星のように「あれもいいな」「これもいいな」と可能性が膨らんでいく。でも、そこから先へ進むには次の力が必要です。"},

{ch:4, ic:"⚠️", q:"ケセドからゲブラーへ移動するタイミングを逃すと、何が起こる？",
 o:["ティファレトに一足飛びに上がれる","いつの間にかイエソド（9）の無意識の制限のループに落ちてしまう","何も起こらない","ケテルに還る"], a:1,
 e:"正解は「イエソドの制限のループに落ちてしまう」。\n行動も選択もせず「あれもいいな」と夢見ているだけだと、その広がりは固まって「こうあるべきだ」という思い込みに変わります。ケセドで得た安心が、逆に新しいことへの恐れになってしまうのです。"},

{ch:4, ic:"🔄", q:"ケセドの「安心安全」について、正しいのは？",
 o:["一度作ったら一生変わらない","人生をかけて更新していく必要がある","更新すると危険になる","子供の頃のものが一番正しい"], a:1,
 e:"正解は「人生をかけて更新していく必要がある」。\n子供の頃の安心安全は、大人になっても通用するとは限りません。この更新のプロセスこそが、人生の成長です。"},

{ch:4, ic:"♂️", q:"ゲブラー（5）のヘブライ語の意味・対応天体・キーワードの組み合わせは？",
 o:["慈悲／木星／拡大","力、峻厳／火星／選択・行動・意志","美／太陽／俯瞰","勝利／金星／感情"], a:1,
 e:"正解は「力、峻厳／火星／選択・行動・意志」。\nケセドの広がっていくエネルギーを制限していく力です。"},

{ch:4, ic:"🎯", q:"ゲブラーの「制限」の本当の意味は？",
 o:["自由を奪って可能性を狭めるだけのもの","無限の可能性から一つを選び取り、エネルギーを一点に集中させる創造的な力","他人を攻撃するための力","何もしないための言い訳"], a:1,
 e:"正解は「エネルギーを一点に集中させる創造的な力」。\n制限することは、エネルギーを単一性の方向へ移動させること。その集中した力が、現実を動かします。"},

{ch:4, ic:"🔥", q:"ゲブラーが動く「純粋な目的」とは、どういうもの？",
 o:["他人の評価や損得勘定から離れた、自分の意志による行動","みんながやっているからやる行動","評価されるための行動","バレなければいい、という行動"], a:0,
 e:"正解は「他人の評価や損得から離れた、自分の意志による行動」。\nヴェールの上にあるこの領域には、外の世界の雑音は届きません。「私の魂が本当に望んでいることは何か」に答えて動くのがゲブラーです。"},

{ch:4, ic:"🕯", q:"ゲブラーが司る「意志」とは、どんなもの？",
 o:["単なる「やりたい」という欲望","魂の奥底から湧き上がる、存在の核心からの叫び","他人を思い通りに動かす力","我慢して耐え続ける力"], a:1,
 e:"正解は「魂の奥底から湧き上がる、存在の核心からの叫び」。\n真の意志は、自己を超えたところからやってきます。あなたの中を通って流れる、宇宙の創造的な力なのです。"},

{ch:4, ic:"☀️", q:"ティファレト（6）のヘブライ語の意味・対応天体・キーワードの組み合わせは？",
 o:["美、調和／太陽／俯瞰・氣づき・中心","栄光／水星／思考","理解／土星／枠組み","王国／地球／現実"], a:0,
 e:"正解は「美、調和／太陽／俯瞰・氣づき・中心」。\n生命の樹のまさに中心に位置しています。"},

{ch:4, ic:"🧭", q:"ティファレトが「中点」と呼ばれるのはなぜ？",
 o:["10のセフィラの6番目だから","ケテルとマルクトをつなぐ線上の中央にあり、人間と神的なものの間の中点だから","一番明るいから","一番新しいセフィラだから"], a:1,
 e:"正解は「ケテルとマルクトをつなぐ線上の中央だから」。\n上も下も、内も外も、光も闇も、すべてを俯瞰して観察できる位置。それがティファレトです。"},

{ch:4, ic:"🧘", q:"ティファレトが目覚めると得られる力は？",
 o:["未来を的中させる力","メタ認知（自分自身を客観的に観察する力）","他人を思い通りに動かす力","感情を完全に消す力"], a:1,
 e:"正解は「メタ認知」。\n感情に振り回されながらも、同時に「ああ、今私は怒っているんだな」と氣づける。この二重の視点こそがティファレトの力です。"},

{ch:4, ic:"🪞", q:"ティファレトの視点から見ると、誰かに強く反応してしまった感情は何を意味する？",
 o:["相手が悪いという証拠","自分の内側にある傷や思い込みを映す鏡","無視すべき雑音","前世からの因縁"], a:1,
 e:"正解は「自分の内側を映す鏡」。\n相手があなたを怒らせたのではなく、相手の言動が、あなたの中にあった傷や思い込みに触れたのです。「これは私の何を映しているんだろう？」と問えるようになると、現実のすべてが学びの機会になります。"},

{ch:4, ic:"🌀", q:"4→5→6のエネルギーの流れとして正しいのは？",
 o:["広げる（4）→ 選んで行動する（5）→ 俯瞰して氣づく（6）を、螺旋階段のように循環する","一度通ったら二度と戻らない","6→5→4の順に降りていく","順番はバラバラでよい"], a:0,
 e:"正解は「広げる → 選んで行動する → 俯瞰して氣づく、を循環する」。\nティファレトで氣づいた制限は、また新しいケセドの安心安全を求めます。この循環を繰り返して、少しずつ高い意識へ登っていくのです。"},

{ch:4, ic:"❓", q:"魂の領域（4・5・6）のカードが出たとき、投げかけるとよい問いは？",
 o:["いつ結果が出ますか？","これは本当にあなた自身が望んでいることですか？","周りの人はどう思っていますか？","損はしませんか？"], a:1,
 e:"正解は「これは本当にあなた自身が望んでいることですか？」。\n「誰かに認められたいから望んでいませんか？」「世間が良いと言っているから欲しいだけではないですか？」。この領域は、そこを見極める場所です。"},

{ch:4, ic:"🚫", q:"次のうち、魂の領域（4・5・6）のエネルギーが動かない動機はどれ？",
 o:["なぜかわからないけど心が惹かれる","損得を超えて、これがしたい","みんながやっているから、私もやる","誰も見ていなくても、これは正しい"], a:2,
 e:"正解は「みんながやっているから、私もやる」。\n他人の目を氣にした動機では、ケセド・ゲブラー・ティファレトのエネルギーは動きません。動くのは、損得を超えて心が惹かれるとき、たとえ孤独でもこの道を行くと思えるときです。"},

/* ===== 第6章 ヴェールの下／無意識の制限のループ ===== */
{ch:5, ic:"♀️", q:"ネツァク（7）のヘブライ語の意味・対応天体・キーワードの組み合わせは？",
 o:["勝利、永続／金星／感情・欲望・愛","栄光、輝き／水星／思考・言葉","基礎、土台／月／潜在意識","王国／地球／現実世界"], a:0,
 e:"正解は「勝利、永続／金星／感情・欲望・愛」。\n感情や欲を司る場所です。"},

{ch:5, ic:"👥", q:"ヴェールを越えてネツァクに降りてくると、ティファレトの調和が失われます。その理由は？",
 o:["エネルギーが弱くなるから","本格的に人間の體（からだ）の中にエネルギーが入ってくるから","天体の力が届かなくなるから","時間が止まるから"], a:1,
 e:"正解は「本格的に人間の體の中にエネルギーが入ってくるから」。\nヴェールの下は日常意識の領域。エネルギーが體に入り、現実世界に引っ張られることで、俯瞰の視点は保てなくなります。マルクトは「分離の世界」。たくさんの他人がいて、常に比べる相手がいて、欠乏感や優越感にさらされます。ネツァクは、そうした現実世界の影響に最初に反応する場所なのです。"},

{ch:5, ic:"💗", q:"ネツァクの愛は、ティファレトの愛とどう違う？",
 o:["まったく同じもの","条件や執着がついた、制限された発露である","ネツァクには愛が存在しない","ネツァクの愛のほうが無条件である"], a:1,
 e:"正解は「条件や執着がついた、制限された発露」。\n「あなたが私を愛してくれるなら、私もあなたを愛する」「これを手に入れられたら、幸せになれる」。太陽の無条件の光に対して、金星は条件つきの愛や喜びを表します。"},

{ch:5, ic:"🌊", q:"ネツァクのエネルギーが強すぎると、何が起こる？",
 o:["論理的思考が冴えわたる","感情が先に来て、偏った主観でしか現実を観察できなくなる","何も感じなくなる","他人がまったく氣にならなくなる"], a:1,
 e:"正解は「偏った主観でしか現実を観察できなくなる」。\n好きだから正しい、嫌いだから間違っている。誰かを好きになると欠点が見えなくなり、嫌いになると良いところが見えなくなる。感情が現実認識を歪めてしまうのです。"},

{ch:5, ic:"😖", q:"グリアが説明する「妬み」とは、どんな感情的態度？",
 o:["他者の幸福を、自己の幸福の喪失として受け止める態度","他者を素直に応援する態度","自分の力を過信する態度","何も感じない態度"], a:0,
 e:"正解は「他者の幸福を、自己の幸福の喪失として受け止める態度」。\nそこには「幸せと悲惨の総量は決まっている」という思い込みが隠れています。本当はみんなが幸せになれるのに、妬みがそれを阻んでいるのです。"},

{ch:5, ic:"🥧", q:"妬みの奥に隠れている「思い込み」とは？",
 o:["自分には価値がないという思い込み","幸せと悲惨の総量は決まっていて、誰かが幸せになると自分の分が減るという思い込み","他人はみんな敵だという思い込み","努力は必ず報われるという思い込み"], a:1,
 e:"正解は「幸せの総量は決まっている、という思い込み」。\nグリアは、幸福の総量を制限しているのはその想定そのものだ、と指摘しています。この思い込みを手放せたとき、他人の幸せは自分の喪失ではなくなるのです。"},

{ch:5, ic:"☿️", q:"ホド（8）のヘブライ語の意味・対応天体・キーワードの組み合わせは？",
 o:["勝利／金星／感情","栄光、輝き／水星／思考・言葉・分析","基礎／月／潜在意識","慈悲／木星／拡大"], a:1,
 e:"正解は「栄光、輝き／水星／思考・言葉・分析」。\n思考・情報・理性を司る領域です。"},

{ch:5, ic:"🧩", q:"ホドの思考とネツァクの感情の関係として、正しいのは？",
 o:["思考が先にあり、その結果として感情が生まれる","感情が先にあり、思考は後から理由をつける補完として働く","二つはまったく無関係","思考だけで現実は決まる"], a:1,
 e:"正解は「感情が先、思考は後から理由をつける」。\n私たちは「論理的に考えてこう判断した」と思っていますが、多くの場合は先に感情で決めて、後から理屈をつけているだけなのです。"},

{ch:5, ic:"🎭", q:"ホドの「否定的な諸力」は、なんと呼ばれている？",
 o:["サマエル（嘘をつく者たち）","リリス","ベヒモス","レヴィアタン"], a:0,
 e:"正解は「サマエル（嘘をつく者たち）」。\nこれは故意の嘘だけを指すのではありません。知性が現実を覆い隠してしまうこと、言葉が真実を歪めてしまうこと、そのすべてを含んでいます。"},

{ch:5, ic:"🗣", q:"「言葉の二面性」が意味しているのは？",
 o:["言葉は必ず真実を伝える","真実を語るために使われる同じ言葉が、嘘をつくためにも使われる","言葉は無意味である","言葉は感情と無関係である"], a:1,
 e:"正解は「同じ言葉が嘘をつくためにも使われる」。\n本当は妬んでいるのに「正当な批判だ」と言い換える。本当は怖いのに「慎重なだけだ」と言い換える。こうしてホドの思考が、ネツァクの感情を正当化し、固定化していきます。"},

{ch:5, ic:"🌙", q:"イエソド（9）のヘブライ語の意味・対応天体・キーワードの組み合わせは？",
 o:["基礎、土台／月／潜在意識・思い込み・土台","栄光／水星／思考","王国／地球／肉体","峻厳／火星／意志"], a:0,
 e:"正解は「基礎、土台／月／潜在意識・思い込み・土台」。\n無意識や潜在意識、刷り込み、思い込みの領域。当たり前すぎて氣づかないものが、ここにあります。"},

{ch:5, ic:"🏗", q:"イエソドとマルクトの関係として正しいのは？",
 o:["現実（マルクト）が先にあり、思い込み（イエソド）は後から作られる","イエソドのエネルギーが先で、それが現実化してマルクトになる","二つは無関係である","マルクトを変えないとイエソドは変わらない"], a:1,
 e:"正解は「イエソドが先、現実化はあと」。\nイエソドが土台で、マルクトはその上に建った建物です。土台が変わらないまま現実だけ変えようとしても、同じパターンが繰り返されてしまいます。"},

{ch:5, ic:"🔦", q:"現実を変えたいとき、いちばん大切なのは？",
 o:["マルクトでとにかく努力量を増やすこと","イエソドに潜む固定概念や制限に光を当て、変化させていくこと","ネツァクの感情を消すこと","ホドの思考を止めること"], a:1,
 e:"正解は「イエソドの固定概念を変化させていくこと」。\n「私はこういう人間だ」という思い込みが変わらない限り、現実も変わりません。タロットは、その無意識を照らす光になります。"},

{ch:5, ic:"🌏", q:"マルクト（10）のヘブライ語の意味・対応天体・キーワードの組み合わせは？",
 o:["王国／地球／現実世界・肉体・体験","基礎／月／潜在意識","王冠／海王星／ワンネス","美／太陽／中心"], a:0,
 e:"正解は「王国／地球／現実世界・肉体・体験」。\n私たちが五感で感じられる物質世界そのもの。目に見えて、触れて、聞こえて、味わえて、匂いを嗅げる世界です。"},

{ch:5, ic:"📽", q:"カバラの視点から見ると、マルクトの現実は何の結果？",
 o:["偶然の積み重ね","ネツァク（7）・ホド（8）・イエソド（9）の無意識の制限のループが、そのまま投影されたもの","他人の意志","天体の配置だけで決まるもの"], a:1,
 e:"正解は「7・8・9のループの投影」。\nネツァクで感じた感情、ホドで正当化した思考、イエソドに刷り込まれた思い込み。それらすべてが、マルクトの現実として現れます。「いつも同じパターンを繰り返す」のは、このためです。"},

{ch:5, ic:"🧙", q:"「魔術師は天のギフトを地上に持って戻るために天に上昇する」。この言葉が示しているのは？",
 o:["現実世界から逃げて精神世界に留まるべきだということ","上のセフィラで得た氣づきや力を、マルクトの現実世界で実践できるということ","魔術師にしかできないことがあるということ","上昇したら戻ってこられないということ"], a:1,
 e:"正解は「上で得た氣づきを、現実世界で実践できる」。\nマルクトは変化の場所でもあります。ここで実際に行動し、体験し、学ぶことで、イエソドのパターンも新しく書き換わっていきます。"},

{ch:5, ic:"💭", q:"ネツァク（7）のカードが出たとき、注目すべきポイントは？",
 o:["具体的な行動","感情。それはどこから来ているのか、本当に自分自身の感情なのか","天体の運行","他人の評価"], a:1,
 e:"正解は「感情」。\nネツァクが強すぎると感情に振り回されますが、感情を無視することもできません。大切なのは、感情を認めつつも、それに飲み込まれないことです。"},

{ch:5, ic:"📝", q:"ホド（8）のカードが出たとき、注目すべきポイントは？",
 o:["思考のパターン。感情を正当化するために理屈をつけていないか","過去の記憶","他人の性格","天体の配置"], a:0,
 e:"正解は「思考のパターン」。\n「あなたは今、どんな言葉で自分を説明していますか？」「その説明は本当に正確ですか？」。切り分け方が偏っていると、現実認識が歪みます。"},

{ch:5, ic:"🔍", q:"イエソド（9）のカードが出たとき、注目すべきポイントは？",
 o:["具体的な行動計画","無意識の観念・固定概念・制限","他人の意見","お金の流れ"], a:1,
 e:"正解は「無意識の観念や固定概念、制限」。\n「自分についてどんな思い込みを持っていますか？」「それは本当に真実ですか？ それとも過去の経験から作られた思い込みですか？」と問いかけてみてください。"},

{ch:5, ic:"👣", q:"マルクト（10）のカードが出たとき、注目すべきポイントは？",
 o:["具体的な行動。現実を変えるために何ができるか","前世の記憶","相手の気持ちだけ","運命の流れ"], a:0,
 e:"正解は「具体的な行動」。\nどんなに素晴らしい洞察を得ても、マルクトで実践しなければ意味がありません。小さな一歩でもいいので、現実世界で動くことが大切です。"},

/* ===== 第7章 総仕上げ・天体対応 ===== */
{ch:6, ic:"🌊", q:"対応天体が「海王星」のセフィラは？",
 o:["ケテル（1）","コクマー（2）","ビナー（3）","ティファレト（6）"], a:0,
 e:"正解は「ケテル（1）」。王冠／ワンネス・源・純粋なエネルギー。\n※伝統的には「第一導因」。海王星は現代的解釈です。"},

{ch:6, ic:"⚡", q:"対応天体が「天王星」のセフィラは？",
 o:["ケテル（1）","コクマー（2）","ゲブラー（5）","ホド（8）"], a:1,
 e:"正解は「コクマー（2）」。知恵／ひらめき・火花・男性原理・枠の外。\n※伝統的には「恒星点」と表現されていました。"},

{ch:6, ic:"🪐", q:"対応天体が「土星」のセフィラは？",
 o:["ビナー（3）","ケセド（4）","イエソド（9）","マルクト（10）"], a:0,
 e:"正解は「ビナー（3）」。理解／形・枠組み・女性原理。土の力で枠を作ります。"},

{ch:6, ic:"♃", q:"対応天体が「木星」のセフィラは？",
 o:["ゲブラー（5）","ケセド（4）","ネツァク（7）","ティファレト（6）"], a:1,
 e:"正解は「ケセド（4）」。慈悲、憐れみ／安心安全・記憶・拡大。木星の拡大と豊かさのエネルギーです。"},

{ch:6, ic:"♂️", q:"対応天体が「火星」のセフィラは？",
 o:["ケセド（4）","ゲブラー（5）","ホド（8）","マルクト（10）"], a:1,
 e:"正解は「ゲブラー（5）」。力、峻厳／選択・行動・意志。火星の激しさで、一点に集中させる力です。"},

{ch:6, ic:"☀️", q:"対応天体が「太陽」のセフィラは？",
 o:["ケテル（1）","ティファレト（6）","ネツァク（7）","イエソド（9）"], a:1,
 e:"正解は「ティファレト（6）」。美、調和／俯瞰・氣づき・中心。無意識の闇を照らす、あなたの内なる太陽です。"},

{ch:6, ic:"♀️", q:"対応天体が「金星」のセフィラは？",
 o:["ネツァク（7）","ホド（8）","ケセド（4）","ビナー（3）"], a:0,
 e:"正解は「ネツァク（7）」。勝利、永続／感情・欲望・愛。制限された状態で発露する、条件つきの愛です。"},

{ch:6, ic:"☿️", q:"対応天体が「水星」のセフィラは？",
 o:["ネツァク（7）","ホド（8）","イエソド（9）","コクマー（2）"], a:1,
 e:"正解は「ホド（8）」。栄光、輝き／思考・言葉・分析。分けて選別することで制限します。"},

{ch:6, ic:"🌙", q:"対応天体が「月」のセフィラは？",
 o:["イエソド（9）","マルクト（10）","ティファレト（6）","ケテル（1）"], a:0,
 e:"正解は「イエソド（9）」。基礎、土台／潜在意識・思い込み・土台。目には見えないけれど、現実に最も強く影響を与える場所です。"},

{ch:6, ic:"🌏", q:"対応天体が「地球」のセフィラは？",
 o:["イエソド（9）","マルクト（10）","ケセド（4）","ゲブラー（5）"], a:1,
 e:"正解は「マルクト（10）」。王国／現実世界・肉体・体験。すべてのエネルギーが最終的に形になる場所です。"},

{ch:6, ic:"🧗", q:"生命の樹の中で、私たちが「成長していく」ときの進み方は？",
 o:["ケテルからマルクトへ、上から下へ","マルクトから出発し、下から上へ登っていく","横方向にだけ動く","動かないのが正しい"], a:1,
 e:"正解は「下から上へ」。\n創造のエネルギーが降りてくるのは上から下（ケテル→マルクト）。でも私たちが意識を成長させていく旅は、マルクト（現実）から出発し、イエソド（無意識）を抜け、ティファレト（魂）で目覚めていく道のりです。\n（実際のエネルギーは、いつも一方向に動くわけではありません。パスの使い方も人それぞれ。ここでは大きな地図として捉えてくださいね）"},

{ch:6, ic:"🌈", q:"最後の問題です。生命の樹を学ぶ、いちばんの目的は？",
 o:["未来を的中させて驚かせるため","難しい専門用語を覚えるため","宇宙の法則を知り、この現実世界（マルクト）をより良く創造していくため","現実から離れて神秘の世界に浸るため"], a:2,
 e:"全問おつかれさまでした。\n正解は「現実世界をより良く創造していくため」。\n精神世界で得た氣づきやエネルギーを、この地球に持ち帰って、具体的な行動や表現に変えていく。生命の樹は、そのための地図です。"}
];

/* ========================= ロジック ========================= */
const app = document.getElementById("app");
const STORE = "sirius_tree_quiz_v1";

let state = {
  mode:"home",     // home | cover | quiz | result
  pool:[],         // 出題中の問題配列
  idx:0,
  score:0,
  wrong:[],
  chapter:null,    // 章番号 or null(全問)
  answered:false,
  chosen:-1
};

function loadBest(){
  try{ return JSON.parse(localStorage.getItem(STORE)) || {}; }catch(e){ return {}; }
}
function saveBest(key, score, total){
  const b = loadBest();
  const prev = b[key];
  if(!prev || score > prev.s){ b[key] = {s:score, t:total}; }
  try{ localStorage.setItem(STORE, JSON.stringify(b)); }catch(e){}
}
function chapterQuestions(ci){ return QUIZ.filter(q => q.ch === ci); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---- トップ画面 ---- */
function renderHome(){
  const best = loadBest();
  let list = "";
  CHAPTERS.forEach((c,i)=>{
    const n = chapterQuestions(i).length;
    const b = best["ch"+i];
    const sc = b ? '<span class="score">'+b.s+"/"+b.t+"</span>" : '<span class="score" style="color:var(--ink-soft)">未</span>';
    list += '<button class="chbtn" data-ch="'+i+'">'
      + '<span class="num">'+(i+1)+'</span>'
      + '<span class="body"><span class="t">'+c.ic+" "+esc(c.t)+' <span style="font-size:11px;color:var(--ink-soft)">（'+n+'問）</span></span>'
      + '<span class="d">'+esc(c.d)+'</span></span>'
      + sc + '</button>';
  });

  app.innerHTML =
    '<div class="card hero fade">'
    + '<div class="tree">🌳</div>'
    + '<h1>生命の樹入門クイズ</h1>'
    + '<div class="sub">SIRIUS ROOM ｜ 全'+QUIZ.length+'問</div>'
    + '<p class="lead">『生命の樹入門 完全解説』の内容を、まるごとクイズにしました。<br>暗記しなくて大丈夫。まちがえても、そのたびに解説が出てきます。構造をなぞりながら、体に入れていきましょう。</p>'
    + '<div class="rulebox">'
      + '<div>🌙 全'+CHAPTERS.length+'章・全'+QUIZ.length+'問。章ごとに挑戦できます</div>'
      + '<div>✨ 4つの選択肢から選ぶだけ。答えるとすぐ解説が出ます</div>'
      + '<div>🕯 章ごとのベストスコアは、この端末に記録されます</div>'
    + '</div>'
    + '<button class="btn" id="allBtn">全'+QUIZ.length+'問に通しで挑戦する</button>'
    + '</div>'
    + '<h2 class="sec"><span>章 を え ら ぶ</span></h2>'
    + '<div class="chlist fade">'+list+'</div>'
    + '<div class="foot">作成：シリウスの部屋 mayumi</div>';

  document.getElementById("allBtn").onclick = ()=> startQuiz(null);
  document.querySelectorAll(".chbtn").forEach(b=>{
    b.onclick = ()=> startQuiz(parseInt(b.dataset.ch,10));
  });
  window.scrollTo(0,0);
}

/* ---- 開始 ---- */
function startQuiz(ci){
  state.chapter = ci;
  state.pool = (ci === null) ? QUIZ.slice() : chapterQuestions(ci);
  state.idx = 0; state.score = 0; state.wrong = [];
  state.answered = false; state.chosen = -1;
  state.mode = "cover";
  renderCover(ci === null ? 0 : ci);
}

/* ---- 章とびら ---- */
function renderCover(ci){
  const c = CHAPTERS[ci];
  const label = (state.chapter === null)
    ? "全"+QUIZ.length+"問・通し挑戦"
    : "第"+(ci+1)+"章";
  app.innerHTML =
    '<div class="card cover fade">'
    + '<div class="ic">'+c.ic+'</div>'
    + '<div class="ch">'+label+'</div>'
    + '<h2>'+esc(c.t)+'</h2>'
    + '<p>'+esc(c.lead)+'</p>'
    + '<button class="btn" id="go">はじめる</button>'
    + '<button class="btn ghost" id="back">トップにもどる</button>'
    + '</div>';
  document.getElementById("go").onclick = ()=>{ state.mode="quiz"; renderQ(); };
  document.getElementById("back").onclick = goHome;
  window.scrollTo(0,0);
}

/* ---- 出題 ---- */
function renderQ(){
  const q = state.pool[state.idx];
  const total = state.pool.length;
  const prog = (state.idx / total) * 100;
  const chName = CHAPTERS[q.ch].t;

  let opts = "";
  q.o.forEach((o,i)=>{
    opts += '<button class="opt" data-i="'+i+'"><span class="mk">'+(i+1)+'</span><span>'+esc(o)+'</span></button>';
  });

  app.innerHTML =
    '<div class="topbar"><span>第'+(q.ch+1)+'章　'+esc(chName)+'</span><button class="home" id="hm">中断してトップへ</button></div>'
    + '<div class="bar"><i style="width:'+prog+'%"></i></div>'
    + '<div class="card fade">'
      + '<div class="qno">QUESTION '+(state.idx+1)+' / '+total+'</div>'
      + '<div class="qtext">'+esc(q.q)+'</div>'
      + '<div class="opts" id="opts">'+opts+'</div>'
      + '<div id="after"></div>'
    + '</div>';

  document.getElementById("hm").onclick = goHome;
  document.querySelectorAll(".opt").forEach(b=>{
    b.onclick = ()=> answer(parseInt(b.dataset.i,10));
  });
  window.scrollTo(0,0);
}

function answer(i){
  if(state.answered) return;
  state.answered = true;
  const q = state.pool[state.idx];
  const ok = (i === q.a);
  if(ok){ state.score++; } else { state.wrong.push({q:q.q, a:q.o[q.a]}); }

  document.querySelectorAll(".opt").forEach((b,bi)=>{
    b.disabled = true;
    if(bi === q.a) b.classList.add("correct");
    else if(bi === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  const last = (state.idx === state.pool.length - 1);
  document.getElementById("after").innerHTML =
    '<div class="judge '+(ok?"ok":"ng")+' fade">'
      + '<span class="mark">'+(ok?"⭕":"✖️")+'</span>'
      + '<span class="txt">'+(ok?"正解！":"惜しい！")+'</span>'
    + '</div>'
    + '<div class="exp fade"><span class="ic">'+q.ic+'</span>'+esc(q.e)+'</div>'
    + '<button class="btn" id="nx">'+(last?"結果を見る":"次の問題へ")+'</button>';

  document.getElementById("nx").onclick = next;
  document.getElementById("nx").scrollIntoView({behavior:"smooth", block:"center"});
}

function next(){
  state.answered = false;
  const nextIdx = state.idx + 1;
  if(nextIdx >= state.pool.length){ return renderResult(); }
  // 通し挑戦のとき、章が変わったら章とびらをはさむ
  if(state.chapter === null && state.pool[nextIdx].ch !== state.pool[state.idx].ch){
    state.idx = nextIdx;
    const ci = state.pool[nextIdx].ch;
    const c = CHAPTERS[ci];
    app.innerHTML =
      '<div class="card cover fade">'
      + '<div class="ic">'+c.ic+'</div>'
      + '<div class="ch">第'+(ci+1)+'章</div>'
      + '<h2>'+esc(c.t)+'</h2>'
      + '<p>'+esc(c.lead)+'</p>'
      + '<button class="btn" id="go">つづける</button>'
      + '</div>';
    document.getElementById("go").onclick = renderQ;
    window.scrollTo(0,0);
    return;
  }
  state.idx = nextIdx;
  renderQ();
}

/* ---- 結果 ---- */
function renderResult(){
  const total = state.pool.length;
  const s = state.score;
  const rate = s / total;
  let rank, msg;
  if(rate === 1){
    rank = "👑 ケテルの体現者";
    msg = "全問正解です。構造がすっかり体に入っていますね。この知識は、そのままリーディングの土台になります。";
  } else if(rate >= 0.8){
    rank = "☀️ ティファレトの覚醒者";
    msg = "お見事です。全体を俯瞰する視点ができています。あと少しで完璧！";
  } else if(rate >= 0.6){
    rank = "⚔️ ゲブラーの挑戦者";
    msg = "しっかり選び取れています。まちがえたところをもう一度読み返すと、一気につながりますよ。";
  } else if(rate >= 0.4){
    rank = "🌙 イエソドの探求者";
    msg = "土台づくりの真っ最中。解説を読みながら、もう一周してみましょう。";
  } else {
    rank = "🚶 マルクトの冒険者";
    msg = "旅は始まったばかり。暗記しなくて大丈夫です。解説をゆっくり読んで、もう一度どうぞ。";
  }

  const key = (state.chapter === null) ? "all" : ("ch"+state.chapter);
  saveBest(key, s, total);

  let review = "";
  if(state.wrong.length){
    review = '<div class="review"><h3>◆ もう一度確認したいところ（'+state.wrong.length+'問）</h3>'
      + state.wrong.map(w=> '<div class="rv"><div class="q">'+esc(w.q)+'</div><div class="a">→ '+esc(w.a)+'</div></div>').join("")
      + '</div>';
  }

  app.innerHTML =
    '<div class="card result fade">'
      + '<div class="ch" style="font-size:12px;letter-spacing:.2em;color:var(--ink-soft)">'
      + (state.chapter === null ? "全問通し挑戦" : "第"+(state.chapter+1)+"章　"+esc(CHAPTERS[state.chapter].t))
      + '</div>'
      + '<div class="score">'+s+' <small>/ '+total+'</small></div>'
      + '<div class="rank">'+rank+'</div>'
      + '<p class="msg">'+msg+'</p>'
      + review
      + '<button class="btn" id="again">もう一度挑戦する</button>'
      + '<button class="btn ghost" id="home">トップにもどる</button>'
    + '</div>'
    + '<div class="foot">作成：シリウスの部屋 mayumi</div>';

  document.getElementById("again").onclick = ()=> startQuiz(state.chapter);
  document.getElementById("home").onclick = goHome;
  window.scrollTo(0,0);
}

function goHome(){ state.mode="home"; renderHome(); }

renderHome();
</script>
</body>
</html>
